<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Суреттер галереясы</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }
    h1 { text-align: center; margin: 0 0 24px; }
    .gallery {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr));
      gap: 24px;
    }
    figure {
      margin: 0;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }
    figcaption { padding: 10px 14px; font-size: 15px; }
  </style>
</head>
<body>
  <h1>Суреттер галереясы</h1>
  <main>
    <section class="gallery">
        <figure>
          <img
          src="images/photo1.jpg"
          alt="Қытайдағы көл жағасындағы дәстүрлі пагода"
          width="600"
          height="400"
          >
          <figcaption>1. Пагода</figcaption>
        </figure>
        <figure>
          <img
          src="images/photo2.jpg"
          alt="Қызғылт сары далия гүлі"
          width="600"
          height="400"
          >
          <figcaption>2. Гүл</figcaption>
        </figure>
        <figure>
          <img
          src="images/photo3.jpg"
          alt="Заманауи қонақүй ғимараты"
          width="600"
          height="400"
          >
          <figcaption>3. Ғимарат</figcaption>
        </figure>
        <figure>
          <img
          src="images/photo4.jpg"
          alt="Көгілдір аспандағы сарғыш мешіт мұнаралары"
          width="600"
          height="400"
          loading="lazy"
          >
          <figcaption>4. Мұнаралар</figcaption>
        </figure>
        <figure>
          <img
          src="images/photo5.jpg"
          alt="Жапырақтағы қара көбелек"
          width="600"
          height="400"
          loading="lazy"
          >
          <figcaption>5. Көбелек</figcaption>
        </figure>
        <figure>
          <img
          src="images/photo6.jpg"
          alt="Үстелдегі жеміс-жидектер"
          width="600"
          height="400"
          loading="lazy"
          >
          <figcaption>6. Жемістер</figcaption>
        </figure>
        <figure>
          <img
          src="images/photo7.jpg"
          alt="Маймылдың портреті"
          width="600"
          height="400"
          loading="lazy"
          >
          <figcaption>7. Маймыл</figcaption>
        </figure>
        <figure>
          <img
          src="images/photo8.jpg"
          alt="Құмырадағы алоэ өсімдігі"
          width="600"
          height="400"
          loading="lazy"
          >
          <figcaption>8. Алоэ</figcaption>
        </figure>
        <figure>
          <img
          src="images/photo9.jpg"
          alt="Қабырғадағы граффити суреті"
          width="600"
          height="400"
          loading="lazy"
          >
          <figcaption>9. Граффити</figcaption>
        </figure>
        <figure>
          <img
          src="images/photo10.jpg"
          alt="Қала көшесіндегі көк автобус"
          width="600"
          height="400"
          loading="lazy"
          >
          <figcaption>10. Автобус</figcaption>
        </figure>
    </section>
  </main>
</body>
</html>
